# Q-REX — full stack. `docker compose up --build`
x-py: &py
  build: .
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/code/data
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qrex
      POSTGRES_PASSWORD: qrex
      POSTGRES_DB: qrex
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]   # host-local only (tests / psql); never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrex"]
      interval: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]   # host-local only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mailpit:  # SMTP capture for the email alert channel; UI at :8025
    restart: unless-stopped
    image: axllent/mailpit:latest
    ports: ["8025:8025", "127.0.0.1:1025:1025"]   # inbox UI public, SMTP host-local

  mock-platform:
    restart: unless-stopped
    build: .
    env_file: .env
    command: uvicorn mockp.main:app --host 0.0.0.0 --port 9000
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      retries: 20

  api:
    <<: *py
    command: sh -c "cd api && alembic upgrade head && cd .. && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30

  worker:
    <<: *py
    command: celery -A workers.celery_app worker -l info -c 4
    depends_on:
      api: { condition: service_healthy }   # api runs migrations

  beat:
    <<: *py
    command: celery -A workers.celery_app beat -l info -s /tmp/celerybeat-schedule
    depends_on:
      api: { condition: service_healthy }

  web:
    restart: unless-stopped
    build:
      context: ./web
      args:
        # Baked into the browser bundle at build time: must be reachable from the
        # viewer's browser. Set PUBLIC_API_URL / PUBLIC_MOCK_URL in .env, then rebuild web.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MOCK_URL: ${PUBLIC_MOCK_URL:-http://localhost:9000}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
